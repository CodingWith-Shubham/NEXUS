[project]
name = "jarvis-laptop-agent"
version = "0.1.0"
description = "JARVIS laptop agent: runs signed, sandboxed file commands in ~/Downloads"
requires-python = ">=3.11,<3.15"
dependencies = [
    # Supabase client: the agent's only network access (outbound HTTPS polling).
    "supabase>=2.34.1",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["I", "UP"]
