# JARVIS core configuration.

[user]
# IANA time zone for dates, times and reminders. Empty = the server's local zone.
timezone = "Asia/Kolkata"
# Languages you speak (BCP-47). The first is the voice's speech language; all are
# hints for transcribing you, so accented English isn't misheard as another language.
languages = ["en-IN", "hi-IN"]

[skills]
# Skill packs to load, by folder name under skills/. Remove a name to unload
# its tools and prompt section; the core never imports a pack directly.
# "demo" (Phase 1 test tools) is left out to keep the voice tool list short;
# add it back to run evals/phase1_audio.yaml.
enabled = ["assistant", "workspace", "research", "sales"]

[voice]
# Gemini Live works best with a small tool set. The registry warns past this.
# 4 core + 6 assistant + 2 workspace reads (list_events, search_email) + 4 research
# (start_research, get_research_status, cancel_research, ask_report) + 6 sales
# (find_leads, list_leads, approve_lead, reject_lead, draft_outreach, manage_lead_schedules),
# plus web_search while web_search = "tool". Everything else is worker-only.
# That's a lot for Gemini Live: if it starts picking the wrong tool, unload a pack you
# aren't using, or move rare tools to worker-only.
max_tools = 23
# Web search for current information, with source URLs:
#   "live" = Google Search grounding inside Gemini Live (no extra tool). Needs Google
#            Search quota on the Gemini key (a billed project); without it Gemini Live
#            refuses the whole session.
#   "tool" = a web_search tool backed by the [search] provider below.
#   "off"  = no web search.
web_search = "tool"
# How many recent conversation summaries to load at the start of a session.
session_summaries_in_prompt = 3
# How often the voice front checks for finished tasks to announce.
announce_poll_secs = 3

[search]
# Who answers web_search (in "tool" mode, and for the worker in any mode):
#   "tavily" = Tavily search API (TAVILY_API_KEY); the worker model writes the answer.
#   "google" = Google Search grounding on google_model (needs a billed Gemini key).
provider = "tavily"
google_model = "gemini-3.6-flash"
# Results fetched per search. Tavily: 0-20.
max_results = 5
# Tavily search depth: "basic" (1 credit), "advanced" (2 credits), "fast", "ultra-fast".
depth = "basic"

[workspace]
# Calendar and email provider: "google" (Gmail + Google Calendar) or "microsoft"
# (Microsoft Graph; not implemented yet, answers "not available").
provider = "google"
# Google OAuth for Gmail + Calendar (separate from signing in to JARVIS): register
# redirect_uri exactly on the OAuth client in Google Cloud. Each user connects their
# own account from sign_in_url (the Settings page).
redirect_uri = "http://localhost:7860/auth/google/callback"
sign_in_url = "http://localhost:7860/settings"
# find_free_time only offers slots inside these hours (your time zone).
working_hours = "09:00-18:00"

[worker]
# Text models for background tasks, session summaries and web-search answers, as
# "provider:model". Tried in order: when one fails (rate limit, outage, empty reply)
# the next is used. The voice (Gemini Live) is separate.
# OpenRouter ":free" models share 20 requests/minute and 50/day across all of them
# (1000/day once you have bought at least $10 of OpenRouter credits). Drop ":free" to
# use the paid versions. The Gemini models are last resorts: free tier, 20 requests/day
# each, separate from OpenRouter. A model that reports its daily limit is skipped
# for an hour.
models = [
    "openrouter:nvidia/nemotron-3.5-super-vl:free",
    "openrouter:nvidia/nemotron-3-ultra-550b-a55b:free",
    "gemini:gemini-3.5-flash-lite",
    "gemini:gemini-3.1-flash-lite",
]
poll_secs = 2
# Most model/tool round trips one task may take before it must answer.
max_steps = 8

# OpenAI-compatible endpoints the worker models can use. The key is read from the
# named environment variable (server/.env).
[providers.openrouter]
base_url = "https://openrouter.ai/api/v1"
api_key_env = "NEMOTRON_KEY"

# Gemini's OpenAI-compatible endpoint (tool calls tested with the flash-lite models;
# their thought signatures are passed back automatically).
[providers.gemini]
base_url = "https://generativelanguage.googleapis.com/v1beta/openai/"
api_key_env = "GOOGLE_API_KEY"

[web]
# Sign-in pages, on the bot's server. Users sign in with Google (openid, email,
# profile); only addresses in ALLOWED_EMAILS (server/.env) get in.
# Login callback registered on the Google OAuth client: <public_url>/auth/login/callback
# An https:// public_url turns on the Secure flag on the session cookie.
public_url = "http://localhost:7860"
# How long a sign-in lasts before the user must sign in again.
session_hours = 168

[research]
# Deep research (skills/research): a worker job that plans sub-questions, searches with
# the [search] provider, reads the best pages in full, and writes a cited report.
# Search results considered per sub-question, and the most pages read for any one of them.
results_per_search = 5
pages_per_question = 3
# Text kept from each page for the model, and page text sent per extraction call (each
# call is one worker-model request: free OpenRouter models allow 20 a minute, 50 a day).
page_chars = 8000
extract_batch_chars = 24000
fetch_timeout_secs = 15

# Limits per depth. When one is reached the job stops gathering, writes up what it found,
# and says which limit was hit. The time budget covers planning, searching, reading and
# extracting; writing the report comes after it. Failed page fetches count as pages.
[research.quick]
sub_questions = 3
max_searches = 3
max_pages = 5
time_budget_secs = 150

[research.standard]
sub_questions = 4
max_searches = 6
max_pages = 10
time_budget_secs = 360

[research.deep]
sub_questions = 6
max_searches = 12
max_pages = 20
time_budget_secs = 720

[sales]
# Lead finding (skills/sales). The profile it works from (industries, regions, buying
# signals and their points, thresholds, job titles, tone) is per user, on /sales/profile.
# Limits per lead search (a scheduled sweep is one lead search):
max_searches = 6
max_pages = 12
time_budget_secs = 360
results_per_search = 5
pages_per_query = 2
# Signals older than this, or without a publication date, are dropped.
max_signal_age_days = 183

[contacts]
# Who looks up contact details for approved leads: "signalhire", "lusha" (not built yet)
# or "none". Every lookup needs the user's approval; SignalHire charges a credit per match.
provider = "signalhire"
# SignalHire normally delivers results to a callback URL it can reach from the internet.
# Running on localhost it can't, so leave this empty: lookups then use SignalHire's
# synchronous mode (immediate, from SignalHire's own data, fewer contacts found).
# With a public URL (e.g. an ngrok https address forwarding to port 7860), set it here
# and lookups use the full asynchronous mode with the callback.
callback_base_url = ""
