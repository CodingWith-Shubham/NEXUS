[project]
name = "JARVIS"
version = "0.1.0"
description = "Voice AI bot built with Pipecat"
# onnxruntime, a pipecat-ai dependency, has no Python 3.15 wheels yet.
requires-python = ">=3.11,<3.15"
dependencies = [
    "authlib>=1.6",
    "cryptography>=46",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "pipecat-ai[evals,google,runner,silero,webrtc]>=1.12.0",
    "pipecatcloud",
    "supabase>=2.34.1",
]

[dependency-groups]
dev = [
    "pyright>=1.1.404,<2",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.12.11,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests", "skills"]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["I", "UP"]
